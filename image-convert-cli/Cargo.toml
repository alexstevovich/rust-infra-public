[package]
name = "alexstevovich-image-convert-cli"
description = "CLI for converting still and animated images with explicit transforms and codec options"
version.workspace = true
edition.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "README.md"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image-convert = { package = "alexstevovich-image-convert", path = "../image-convert" }
tempfile = "3"

[[bin]]
name = "image-convert"
path = "src/main.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
