[package]
name = "alexstevovich-comfyui-meta-copy-cli"
description = "Command-line lossless ComfyUI metadata copier for PNG and WebP images"
version.workspace = true
edition.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "README.md"]

[[bin]]
name = "comfyui-meta-copy"
path = "src/main.rs"

[dependencies]
comfyui-meta = { package = "alexstevovich-comfyui-meta", path = "../comfyui-meta" }
image-container-meta = { package = "alexstevovich-image-container-meta", path = "../image-container-meta" }
